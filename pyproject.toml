[project]
name = "cineclock"
version = "2.5.0"
description = "Vancouver showtimes for film lovers. Indie and rep cinemas in one place."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cineclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
