name: Snapshot

# Hand-run: an encrypted copy of the database for a local preview. Only the
# holder of the private key matching the public key given can read it.
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "RSA public key (PEM, base64)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: cineclock.db
          key: db-snapshot-${{ github.run_id }}
          restore-keys: db-
      - name: Encrypt and push
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          echo "$PUBLIC_KEY" | base64 -d > pub.pem
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in cineclock.db -out db.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in key.bin -out key.enc
          rm key.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan snapshot
          git rm -rfq .
          git add -f db.enc key.enc
          git commit -qm "Encrypted database snapshot"
          git push -fq origin snapshot
