name: Screenshots

# Run by hand from the Actions tab (or the API) to refresh the README pictures.
# It builds the site from the same saved database the deploy uses, so the
# screenshots show real posters and scores, then commits them to docs/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium

      # Read the deploy's database; never save over it.
      - uses: actions/cache/restore@v6
        with:
          path: cineclock.db
          key: db-screenshots-${{ github.run_id }}
          restore-keys: db-

      - run: python -m cineclock.build
      - run: python tools/screenshots.py

      - name: Commit the new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/home.png docs/films.png docs/film.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Refresh README screenshots"
            git push
          fi
