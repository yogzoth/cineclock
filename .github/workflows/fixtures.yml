name: Fixtures

# Run by hand. Saves real responses from theatre feeds that Claude's workspace
# can't reach (the Park's) into tests/fixtures, and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python tools/save_fixtures.py
      - name: Commit the fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures
          if git diff --cached --quiet; then
            echo "Fixtures unchanged."
          else
            git commit -m "Save Park feed fixtures"
            git push
          fi
