name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 4 hours, off the hour so it doesn't queue behind everyone else's jobs.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

      # Keep the database between runs so past screenings stay as history.
      - uses: actions/cache/restore@v4
        with:
          path: cineclock.db
          key: db-${{ github.run_id }}
          restore-keys: db-
      - run: python -m cineclock.scrape
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      # New listings get one cheap AI read for tags the patterns miss (ai.py).
      - run: python -m cineclock.ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Banner and blurb for each festival page, from the theatre's page for it.
      - run: python -m cineclock.festivals
      - uses: actions/cache/save@v4
        with:
          path: cineclock.db
          key: db-${{ github.run_id }}

      - run: python -m cineclock.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A theatre whose scraper keeps failing still shows its last listings, so the
  # site looks fine. Failing here makes GitHub email Jordan.
  health:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Check every theatre is updating
        run: |
          stale=$(curl -sf https://cineclock.ca/stats.json | jq -r '.stale | join(", ")')
          if [ -n "$stale" ]; then
            echo "::error::No fresh listings from: $stale (3+ failed scrapes in a row)"
            exit 1
          fi
          echo "Every theatre updated."
